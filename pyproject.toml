[project]
name = "clamav-rest"
version = "2.6.3"
description = "A minimal ClamAV REST interface built with containers in mind"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "clamd",
    "hypercorn[uvloop]==0.17.3",
    "quart==0.20.0",
    "aioprometheus==23.12.0",
    "json-logging==1.3.0",
]

[dependency-groups]
dev = [
    "flake8",
    "pytest",
    "requests",
    "pytest-docker==2.0.0",
    "pytest-asyncio==0.21.1",
]

[tool.uv.sources]
clamd = {git = 'https://github.com/temal-/python-clamd-async.git', tag = '1.1.1'}
